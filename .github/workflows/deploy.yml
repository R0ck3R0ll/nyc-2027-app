# Publica la app en Firebase Hosting cada vez que cambia, y las reglas de Firestore.
# Usa la clave de la cuenta de servicio github-deploy guardada en el secreto FIREBASE_SERVICE_ACCOUNT.
name: Publicar en Firebase

on:
  push:
    branches: [main]
    paths: ['app/**', 'firebase.json', 'firestore.rules', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar app y reglas
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: nyc-2027-fe4af
        run: |
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only hosting,firestore:rules --project "$PROJECT" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
